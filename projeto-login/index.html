<!doctype html>
<html>
<head>
  <title>login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #121212; padding: 20px;">
  
  <img class="banner-anime" src="https://picsum.photos/500/300">
    
<h1 style="color: white; font-family: sans-serif; font-size: 20px; text-align: center; margin-bottom: 25px; font-weight: bold; letter-spacing: 2px;">anime login</h1>
  <input class="caixa-texto" type="text" placeholder="digite seu nome" style="width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; background-color: #222; color: white;"> 
 <input class="caixa-texto" type="password" placeholder="digite sua senha" style="width: 100%; padding: 12px; border: 12px; border: 1px solid #333; border-radius: 8px; margin-bottom: 25px; box-sizing: border-box; background-color: #222; color: white;">

   <button class="botao neon" style="width: 100%; padding: 12px; background-color: white; color: black; border: none; border-radius: 8px; font-weight: bold;">cadastra</button>
    
  <button style="width: 100%; padding: 12px; background-color: transparent; color: #888; border: none; font-size: 14px; margin-top: 15px; font-weight: bold;">já tenho uma conta</button>
    
</body>
</html>
